<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rozvrh</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #eef1f4; color: #1a202c; font-family: system-ui, sans-serif; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 28px; }
  h2 { margin: 24px 0 8px; font-size: 20px; }
  .btns { display: flex; gap: 8px; }
  button { font: inherit; padding: 8px 14px; border: 1px solid #d5dae0; background: #fff; border-radius: 6px; cursor: pointer; }
  button.active { background: #1a202c; color: #fff; border-color: #1a202c; }
  #status { color: #c0392b; margin: 12px 0; min-height: 1.2em; }
  #status.info { color: #555; }
  hr { border: 0; border-top: 1px solid #d5dae0; margin: 12px 0 0; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; background: #fff; min-width: 800px; }
  th, td { border: 1px solid #e1e5ea; padding: 6px 8px; vertical-align: top; font-size: 14px; }
  th { background: #f6f8fa; text-align: center; }
  th.day { text-align: left; white-space: nowrap; width: 90px; }
  th small { display: block; font-weight: normal; color: #667; }
  .lesson { margin-bottom: 4px; }
  .lesson b { font-size: 15px; }
  .lesson span { color: #667; font-size: 12px; display: block; }
  .changed { background: #fdeaea; border-radius: 4px; padding: 2px 4px; }
  .changed span.chg { color: #c0392b; }
  .empty { color: #bbb; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Rozvrh</h1>
    <div class="btns">
      <button data-mode="Actual" class="active">Tento týden</button>
      <button data-mode="Next">Příští týden</button>
      <button data-mode="Permanent">Stálý</button>
    </div>
  </header>
  <div id="status"></div>
  <hr>
  <div id="out"></div>
</div>

<script>
const BASE = "https://znamky.gymji.cz";
const CLASSES = [
  { id: "WF", name: "3. E" },
  { id: "W5", name: "6. E" },
  { id: "W4", name: "7. E" },
];

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const txt = el => (el ? el.textContent.replace(/\s+/g, " ").trim() : "");

function setStatus(msg, info) {
  $("status").textContent = msg || "";
  $("status").className = info ? "info" : "";
}

/* ---------- Parser veřejného rozvrhu Bakalářů ---------- */
function parseTimetable(html) {
  const doc = new DOMParser().parseFromString(html, "text/html");

  // záhlaví hodin
  const hours = [...doc.querySelectorAll(".bk-timetable-header .bk-hour-wrapper")].map(h => ({
    num: txt(h.querySelector(".num")),
    time: txt(h.querySelector(".hour")),
  }));

  const rows = [...doc.querySelectorAll(".bk-timetable-row")].map(row => {
    const day = txt(row.querySelector(".bk-day-day"));
    const date = txt(row.querySelector(".bk-day-date"));
    const cells = [...row.querySelectorAll(".bk-timetable-cell")].map(cell => {
      const items = [...cell.querySelectorAll(".day-item-hover, .day-item-volno")].map(it => {
        let d = {};
        const raw = it.getAttribute("data-detail");
        if (raw) { try { d = JSON.parse(raw); } catch (e) {} }
        const subj = txt(it.querySelector(".middle")) || (d.subjecttext ? d.subjecttext.split("|")[0].trim() : "");
        const group = txt(it.querySelector(".top"));
        const bottom = txt(it.querySelector(".bottom"));
        const change = [d.changeinfo, d.removedinfo].filter(Boolean).join(" ");
        return { subj, group, bottom, teacher: d.teacher || "", room: d.room || "", change };
      }).filter(x => x.subj || x.change);
      return items;
    });
    return { day, date, cells };
  });

  return { hours, rows };
}

function renderTable(t) {
  if (!t.rows.length) return `<p>Rozvrh se nepodařilo přečíst (žádné řádky). Otevři konzoli a pošli mi výstup z testu níže.</p>`;
  const cols = Math.max(...t.rows.map(r => r.cells.length));
  let html = "<div class='scroll'><table><thead><tr><th></th>";
  for (let i = 0; i < cols; i++) {
    const h = t.hours[i] || {};
    html += `<th>${esc(h.num || i)}<small>${esc(h.time || "")}</small></th>`;
  }
  html += "</tr></thead><tbody>";
  t.rows.forEach(r => {
    html += `<tr><th class="day">${esc(r.day)}<small>${esc(r.date)}</small></th>`;
    for (let i = 0; i < cols; i++) {
      const items = r.cells[i] || [];
      html += "<td>" + (items.length ? items.map(a =>
        `<div class="lesson ${a.change ? "changed" : ""}"><b>${esc(a.subj)}</b>`
        + `<span>${esc(a.room || a.bottom)} ${esc(a.teacher)} ${esc(a.group)}</span>`
        + (a.change ? `<span class="chg">${esc(a.change)}</span>` : "")
        + `</div>`).join("") : "<span class='empty'>–</span>") + "</td>";
    }
    html += "</tr>";
  });
  return html + "</tbody></table></div>";
}

/* ---------- Načítání ---------- */
async function loadClass(mode, id) {
  const res = await fetch(`${BASE}/Timetable/Public/${mode}/Class/${id}`);
  if (!res.ok) throw new Error(`${id}: HTTP ${res.status}`);
  return parseTimetable(await res.text());
}

async function load(mode) {
  setStatus("Načítám…", true);
  $("out").innerHTML = "";
  try {
    const results = await Promise.all(CLASSES.map(c => loadClass(mode, c.id)));
    $("out").innerHTML = CLASSES.map((c, i) => `<h2>${esc(c.name)}</h2>` + renderTable(results[i])).join("");
    setStatus("");
  } catch (e) {
    setStatus("Chyba: " + e.message);
  }
}

document.querySelectorAll("[data-mode]").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll("[data-mode]").forEach(x => x.classList.toggle("active", x === b));
    load(b.dataset.mode);
  };
});

load("Actual");
</script>
</body>
</html>
